name: DQt time tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  time-unittests:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          # - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.4.3-minimal
          # - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.5.3-minimal
          # - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.6.3-minimal
          # - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.7.3-minimal
          - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.8.3-minimal
          - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.9.3-minimal
          - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.10.3-minimal
          - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.11.3-minimal
          - ghcr.io/xd8a/ubuntu-dmd:2.113.0-qt6.12.0-minimal

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Show versions
        run: |
          dmd --version | head -1
          dub --version | head -1

      - name: Run corelib/time unittests
        run: |
          set -eux
          # The minimal images have no timezone database, so QTimeZone cannot
          # resolve any zone (systemTimeZone() is invalid, Pacific/Auckland etc.
          # are unavailable). Install tzdata.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq tzdata

          # These images ship Qt under $QTDIR, but that lib directory is not on
          # the linker's default search path, and they lack the libstdc++.so
          # development symlink (only the runtime libstdc++.so.6 is present).
          # Provide both so dub can resolve -lQt6Core and -lstdc++.
          QT_LIBS="$(qtpaths6 --query QT_INSTALL_LIBS 2>/dev/null || echo "${QTDIR:-/opt/Qt/current}/lib")"
          # Qt version of the image. test_runner.d reads it at compile time via
          # `import(".qt_version.txt")` (`stringImportPaths` in dub.json) and
          # prints it at startup; the Qt6_x flags gate version-specific tests.
          QT_VERSION="$(qmake6 -query QT_VERSION 2>/dev/null || qmake -query QT_VERSION 2>/dev/null || echo unknown)"
          echo "$QT_VERSION" > .qt_version.txt

          STDCPP="$(ls /usr/lib/x86_64-linux-gnu/libstdc++.so.6 /lib/x86_64-linux-gnu/libstdc++.so.6 2>/dev/null | head -1)"
          mkdir -p "$HOME/lib"
          ln -sf "$STDCPP" "$HOME/lib/libstdc++.so"

          export DFLAGS="-L-L${QT_LIBS} -L-L${HOME}/lib ${DFLAGS:-}"
          export LD_LIBRARY_PATH="${QT_LIBS}:${LD_LIBRARY_PATH:-}"

          dub run --build=unittest :unittest
